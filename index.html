<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>BnB Connect</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<meta name="theme-color" content="#6C5CE7" />

<!-- Nécessaire pour que l'ajout à l'écran d'accueil iOS s'ouvre en plein
     écran (mode standalone), sans quoi Safari s'ouvre en mode navigateur
     normal même une fois l'icône ajoutée. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BnB Connect" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #6C5CE7;
  }
  #app-frame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  #push-banner {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: env(safe-area-inset-bottom, 12px);
    background: linear-gradient(135deg, #6C5CE7, #A29BFE);
    color: white;
    padding: 14px 16px;
    border-radius: 14px;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #push-banner button {
    background: white;
    color: #6C5CE7;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
  }
  #push-banner .dismiss {
    background: transparent;
    color: white;
    font-size: 18px;
    padding: 0 6px;
    font-weight: 400;
  }
  #call-frame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    z-index: 500;
  }
  #switch-view-btn {
    position: fixed;
    right: 14px;
    /* Sous la vignette caméra locale de call.html (24px + 130px de haut),
       pour ne jamais la recouvrir ni les contrôles du bas. */
    top: calc(env(safe-area-inset-top, 0px) + 168px);
    background: #6C5CE7;
    color: white;
    border: none;
    border-radius: 24px;
    padding: 12px 18px;
    font-family: -apple-system, sans-serif;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    z-index: 9998;
    display: none;
  }
  /* iPhone : la vignette caméra de la page d'appel est décalée vers le bas
     (encoche), le bouton de bascule l'est donc aussi pour ne pas la recouvrir. */
  @supports (-webkit-touch-callout: none) {
    #switch-view-btn {
      top: max(222px, calc(env(safe-area-inset-top, 0px) + 168px));
    }
  }
</style>
</head>
<body>

<iframe id="app-frame" allow="camera; microphone; autoplay"></iframe>
<script>
// Chargement de l'app Streamlit. Si un jeton "Rester connecté" est gardé
// par cette page (stockage de premier niveau, fiable), on l'ajoute à l'URL
// (?rt=...) : l'app s'en sert pour rouvrir la session sans nouvelle saisie.
(function () {
  var url = "https://bconnect-gc85p96w6l29zihyx5zs4e.streamlit.app/?embed=true";
  var token = null;
  try { token = localStorage.getItem("bnb_refresh_token"); } catch (e) {}
  if (token) { url += "&rt=" + encodeURIComponent(token); }
  document.getElementById("app-frame").src = url;
})();
</script>

<iframe id="call-frame" allow="camera; microphone; autoplay"></iframe>

<button id="switch-view-btn">📞 Voir l'appel</button>

<div id="push-banner">
  <span>🔔 Active les notifications pour ne manquer aucun appel</span>
  <div style="display:flex; align-items:center; gap:6px;">
    <button id="push-enable-btn">Activer</button>
    <button class="dismiss" id="push-dismiss-btn">✕</button>
  </div>
</div>

<script>
// ⚠️ À remplacer par tes vraies valeurs Supabase (visibles dans
// Project Settings > API — l'URL du projet et la clé "anon public",
// qui est déjà utilisée publiquement ailleurs dans l'app, ex: call.html).
const SUPABASE_URL = "https://qswsccuuyxunymzwngyv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzd3NjY3V1eXh1bnltenduZ3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDQzNDUsImV4cCI6MjEwMzcyMDM0NX0.slbvmhh89XgRy2lpAoYKS4QbsLQsBRmuw0ccw92FkeE";

// Clé publique VAPID (générée une fois, ne change jamais). La clé privée
// correspondante reste uniquement côté serveur Python (secrets Streamlit).
const VAPID_PUBLIC_KEY = "BNM006T0IWmNdS2vhFN10zIbHAcCjZO6L6z379CmlWcTsW3TBlAudghEp-v2Xyhb2colveywVjePLro6rcaAuco";

const STREAMLIT_APP_ORIGIN = "https://bconnect-gc85p96w6l29zihyx5zs4e.streamlit.app";

let currentUserId = localStorage.getItem("bnb_current_user_id") || null;
// Jeton de session Supabase de l'utilisateur connecté, reçu en direct depuis
// l'app Streamlit. Gardé uniquement en mémoire (jamais dans localStorage).
let currentAccessToken = null;

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function saveSubscriptionToSupabase(subscription, userId, accessToken) {
  const raw = subscription.toJSON();
  const body = {
    user_id: userId,
    endpoint: raw.endpoint,
    p256dh: raw.keys.p256dh,
    auth: raw.keys.auth,
  };
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?on_conflict=endpoint`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${accessToken}`,
      "Prefer": "resolution=merge-duplicates",
    },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`Supabase a refusé l'enregistrement (code ${resp.status}) : ${errText}`);
  }
}

function waitForSession(timeoutMs) {
  // Attend que l'identifiant ET le jeton de session soient reçus depuis
  // l'app (postMessage), sans dépasser timeoutMs — au cas où l'utilisateur
  // tape "Activer" avant que le message ait eu le temps d'arriver.
  return new Promise(function (resolve) {
    const start = Date.now();
    (function check() {
      if (currentUserId && currentAccessToken) {
        return resolve({ userId: currentUserId, accessToken: currentAccessToken });
      }
      if (Date.now() - start > timeoutMs) return resolve(null);
      setTimeout(check, 250);
    })();
  });
}

function isStandaloneMode() {
  return (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}

async function enablePushNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    alert("⚠️ Les notifications push ne sont pas supportées ici. Mode standalone : " +
          (isStandaloneMode() ? "oui" : "non") +
          ". Sur iPhone, ouvre l'appli depuis l'icône de l'écran d'accueil (pas depuis Safari).");
    return;
  }

  // Diagnostic : état de la permission AVANT la demande, et durée de la
  // demande. Une durée très courte (quelques ms) signifie qu'aucune fenêtre
  // d'autorisation n'a été affichée : le système a répondu tout seul.
  const permissionBefore = Notification.permission;
  const standalone = isStandaloneMode();

  if (permissionBefore === "denied") {
    alert("Les notifications sont bloquées pour cette appli.\n\n" +
          "iPhone : Réglages > Notifications > BnB Connect > Autoriser.\n" +
          "Samsung : appui long sur l'icône > Infos sur l'appli > Notifications > Autoriser.\n\n" +
          "Puis ferme et rouvre l'appli.");
    return;
  }

  // IMPORTANT : requestPermission doit être appelé directement dans le clic,
  // sans aucun await avant (sinon iOS ne reconnaît plus le geste).
  const t0 = Date.now();
  let permission;
  try {
    permission = await Notification.requestPermission();
  } catch (e) {
    alert("⚠️ Erreur lors de la demande de permission : " + e.message);
    return;
  }
  const elapsed = Date.now() - t0;

  if (permission !== "granted") {
    alert("La permission de notification a été refusée (" + permission + ").\n\n" +
          "Détails : avant = " + permissionBefore +
          ", durée = " + elapsed + " ms" +
          ", mode standalone = " + (standalone ? "oui" : "non") + ".");
    return;
  }

  let registration;
  try {
    registration = await navigator.serviceWorker.ready;
  } catch (e) {
    alert("⚠️ Le service worker n'est pas prêt : " + e.message);
    return;
  }

  let subscription;
  try {
    subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
  } catch (e) {
    alert("⚠️ Échec de l'abonnement push : " + e.message);
    return;
  }

  const session = await waitForSession(6000);
  if (!session) {
    alert("Connecte-toi d'abord dans l'app, puis réessaie. Si tu es déjà connecté, " +
          "déconnecte-toi puis reconnecte-toi pour que la session soit transmise. " +
          "(identifiant reçu : " + (currentUserId ? "oui" : "non") +
          ", jeton reçu : " + (currentAccessToken ? "oui" : "non") + ")");
    return;
  }

  if (SUPABASE_URL.indexOf("_ICI") !== -1 || SUPABASE_ANON_KEY.indexOf("_ICI") !== -1) {
    alert("⚠️ SUPABASE_URL et SUPABASE_ANON_KEY n'ont pas été remplacés dans index.html.");
    return;
  }

  try {
    await saveSubscriptionToSupabase(subscription, session.userId, session.accessToken);
  } catch (e) {
    alert("⚠️ Échec de l'enregistrement côté serveur : " + e.message);
    return;
  }

  localStorage.setItem("bnb_push_enabled", "1");
  document.getElementById("push-banner").style.display = "none";
  alert("✅ Notifications activées avec succès !");
}

function maybeShowPushBanner() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted" && localStorage.getItem("bnb_push_enabled") === "1") return;
  if (Notification.permission === "denied") return;
  document.getElementById("push-banner").style.display = "flex";
}

// On affiche la bannière après un court délai, qu'on ait déjà reçu ou non
// l'identifiant de l'utilisateur via postMessage (voir enablePushNotifications
// et waitForSession, qui gèrent le cas où il n'est pas encore arrivé) — pour
// ne jamais dépendre d'un timing parfait entre le chargement de la coquille
// et celui de l'app Streamlit à l'intérieur.
setTimeout(maybeShowPushBanner, 2500);

document.getElementById("push-enable-btn").addEventListener("click", enablePushNotifications);
document.getElementById("push-dismiss-btn").addEventListener("click", function () {
  document.getElementById("push-banner").style.display = "none";
});

// --- Bascule entre le chat et l'appel ------------------------------
// En mode "standalone" (app installée sur l'écran d'accueil), il n'y a
// pas de vrais onglets de navigateur : un "nouvel onglet" prendrait toute
// la place sans retour possible. On garde donc l'appel dans un second
// cadre à l'intérieur de cette même page, avec un bouton pour basculer
// manuellement entre les deux — les deux restent actifs en parallèle.
const appFrame = document.getElementById("app-frame");
const callFrame = document.getElementById("call-frame");
const switchBtn = document.getElementById("switch-view-btn");
let showingCall = false;

function showCallView() {
  callFrame.style.display = "block";
  switchBtn.textContent = "💬 Revenir au chat";
  showingCall = true;
}

function showChatView() {
  callFrame.style.display = "none";
  switchBtn.textContent = "📞 Voir l'appel";
  showingCall = false;
}

function ensureSwitchButtonVisible() {
  // Si la position enregistrée du bouton le place hors de l'écran (autre
  // taille d'écran, rotation...), on le remet à sa place par défaut.
  try {
    if (getComputedStyle(switchBtn).display === "none") return;
    const r = switchBtn.getBoundingClientRect();
    const outside = r.left < 0 || r.top < 0 ||
                    r.right > window.innerWidth || r.bottom > window.innerHeight;
    if (outside) {
      switchBtn.style.left = "";
      switchBtn.style.top = "";
      switchBtn.style.right = "";
      try { localStorage.removeItem("bnb_switch_btn_pos"); } catch (e) {}
    }
  } catch (e) {}
}
window.addEventListener("resize", ensureSwitchButtonVisible);

function markCallEndedInSupabase(callUrl) {
  // Filet de sécurité : quand la page d'appel signale la fin de l'appel, on
  // s'assure nous-mêmes que la base le sait (passage de "sonne" ou "en cours"
  // à "terminé"), pour que l'appli de chat n'affiche plus de boutons
  // "Rejoindre / Terminer l'appel". Sans effet si c'est déjà fait (la
  // condition sur le statut évite d'écraser "refusé" ou "terminé").
  try {
    if (!callUrl) return;
    const u = new URL(callUrl);
    const callId = u.searchParams.get("call_id");
    const sbUrl = u.searchParams.get("sb_url") || SUPABASE_URL;
    const sbKey = u.searchParams.get("sb_key") || SUPABASE_ANON_KEY;
    if (!callId) return;
    const tokens = [u.searchParams.get("sb_token"), currentAccessToken].filter(function (t, i, arr) {
      return t && arr.indexOf(t) === i;
    });
    (function tryNext(i) {
      if (i >= tokens.length) return;
      fetch(sbUrl + "/rest/v1/calls?id=eq." + encodeURIComponent(callId) + "&status=in.(ringing,ongoing)", {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "apikey": sbKey,
          "Authorization": "Bearer " + tokens[i],
          "Prefer": "return=minimal",
        },
        body: JSON.stringify({ status: "ended", ended_at: new Date().toISOString() }),
      }).then(function (resp) {
        if (!resp.ok) { tryNext(i + 1); }
      }).catch(function () { tryNext(i + 1); });
    })(0);
  } catch (e) {}
}

function closeCallView() {
  showChatView();
  switchBtn.style.display = "none";
  callFrame.src = "";
}

// Au retour dans l'appli (après un passage en arrière-plan, ou un clic sur une
// notification), si une page d'appel est encore affichée alors que l'appel est
// terminé ou introuvable, on la ferme et on revient au chat : sinon elle
// recouvrait l'appli, sans aucun bouton pour répondre à un nouvel appel.
async function checkCallStillActive() {
  try {
    const src = callFrame.getAttribute("src");
    if (!src) return;
    const u = new URL(src);
    const callId = u.searchParams.get("call_id");
    if (!callId) return;
    const sbUrl = u.searchParams.get("sb_url") || SUPABASE_URL;
    const sbKey = u.searchParams.get("sb_key") || SUPABASE_ANON_KEY;
    const tokens = [u.searchParams.get("sb_token"), currentAccessToken].filter(function (t, i, arr) {
      return t && arr.indexOf(t) === i;
    });
    for (let i = 0; i < tokens.length; i++) {
      const resp = await fetch(sbUrl + "/rest/v1/calls?id=eq." + encodeURIComponent(callId) + "&select=status", {
        headers: { "apikey": sbKey, "Authorization": "Bearer " + tokens[i] },
      });
      if (!resp.ok) continue;
      const rows = await resp.json();
      const status = rows && rows[0] ? rows[0].status : null;
      if (status === null || status === "ended" || status === "declined") { closeCallView(); }
      return;
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) { setTimeout(checkCallStillActive, 600); }
});
window.addEventListener("pageshow", function () {
  setTimeout(checkCallStillActive, 600);
});

function toggleCallChatView() {
  if (showingCall) {
    showChatView();
  } else {
    showCallView();
  }
}

// Bouton déplaçable au doigt (comme la vignette caméra locale dans
// call.html), avec une petite tolérance de mouvement pour distinguer un
// simple tap (bascule chat/appel) d'un vrai glissé (repositionnement).
(function makeSwitchButtonDraggable(el) {
  let dragging = false;
  let moved = false;
  let offsetX = 0, offsetY = 0;
  let startX = 0, startY = 0;
  let suppressNextClick = false;

  function start(x, y) {
    dragging = true;
    moved = false;
    startX = x;
    startY = y;
    const rect = el.getBoundingClientRect();
    offsetX = x - rect.left;
    offsetY = y - rect.top;
  }

  function move(x, y) {
    if (!dragging) return;
    if (Math.abs(x - startX) > 6 || Math.abs(y - startY) > 6) moved = true;
    if (!moved) return;
    const maxLeft = window.innerWidth - el.offsetWidth - 4;
    const maxTop = window.innerHeight - el.offsetHeight - 4;
    const newLeft = Math.max(4, Math.min(x - offsetX, maxLeft));
    const newTop = Math.max(4, Math.min(y - offsetY, maxTop));
    el.style.left = newLeft + "px";
    el.style.top = newTop + "px";
    el.style.right = "auto";
  }

  function end() {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      suppressNextClick = true;
      try {
        localStorage.setItem(
          "bnb_switch_btn_pos",
          JSON.stringify({ left: el.style.left, top: el.style.top })
        );
      } catch (e) {}
    }
  }

  el.addEventListener("mousedown", (e) => start(e.clientX, e.clientY));
  document.addEventListener("mousemove", (e) => move(e.clientX, e.clientY));
  document.addEventListener("mouseup", end);

  el.addEventListener("touchstart", (e) => { const t = e.touches[0]; start(t.clientX, t.clientY); }, { passive: true });
  document.addEventListener("touchmove", (e) => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
  document.addEventListener("touchend", end);

  el.addEventListener(
    "click",
    function (e) {
      if (suppressNextClick) {
        e.stopImmediatePropagation();
        e.preventDefault();
        suppressNextClick = false;
        return;
      }
      toggleCallChatView();
    },
    true
  );

  // Restaure la position laissée la dernière fois, si elle existe.
  try {
    const saved = JSON.parse(localStorage.getItem("bnb_switch_btn_pos") || "null");
    if (saved && saved.left && saved.top) {
      el.style.left = saved.left;
      el.style.top = saved.top;
      el.style.right = "auto";
    }
  } catch (e) {}
})(switchBtn);

// L'app Streamlit (à l'intérieur de l'iframe) annonce l'identifiant de
// l'utilisateur connecté, et demande l'ouverture d'un appel, via
// postMessage.
window.addEventListener("message", function (event) {
  if (event.origin !== STREAMLIT_APP_ORIGIN) return;

  // --- Jeton "Rester connecté" : gardé ici, dans le stockage de cette page ---
  if (event.data && event.data.type === "bnb_save_refresh_token" && event.data.refresh_token) {
    try { localStorage.setItem("bnb_refresh_token", event.data.refresh_token); } catch (e) {}
  }

  if (event.data && event.data.type === "bnb_clear_refresh_token") {
    // Déconnexion (ou jeton devenu invalide) : on oublie aussi la session
    // en mémoire et l'identifiant, pour ne jamais abonner aux notifications
    // un appareil au nom d'un utilisateur déconnecté.
    try { localStorage.removeItem("bnb_refresh_token"); } catch (e) {}
    try { localStorage.removeItem("bnb_current_user_id"); } catch (e) {}
    currentUserId = null;
    currentAccessToken = null;
  }

  if (event.data && event.data.type === "bnb_request_refresh_token") {
    // L'app (session recréée sans rechargement de page) redemande le jeton.
    var savedToken = null;
    try { savedToken = localStorage.getItem("bnb_refresh_token"); } catch (e) {}
    if (savedToken && event.source) {
      event.source.postMessage({ type: "bnb_refresh_token", refresh_token: savedToken }, event.origin);
    }
  }

  if (event.data && event.data.type === "bnb_logged_in" && event.data.user_id) {
    currentUserId = event.data.user_id;
    localStorage.setItem("bnb_current_user_id", currentUserId);
    if (event.data.access_token) {
      currentAccessToken = event.data.access_token;
    }
    maybeShowPushBanner();
  }

  if (event.data && event.data.type === "bnb_open_call" && event.data.url) {
    callFrame.src = event.data.url;
    switchBtn.style.display = "block";
    showCallView();
    ensureSwitchButtonVisible();
  }
});

// call.html (chargé dans #call-frame, même origine que cette page) signale
// la fin de l'appel — qu'il ait été raccroché ici, refusé, ou terminé par
// l'autre personne. On revient alors automatiquement au chat et on masque
// le bouton de bascule, qui n'aurait plus aucun appel à afficher.
window.addEventListener("message", function (event) {
  if (event.data && event.data.type === "bnb_call_ended") {
    markCallEndedInSupabase(callFrame.getAttribute("src"));
    showChatView();
    switchBtn.style.display = "none";
    callFrame.src = "";
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(function (e) {
    alert("⚠️ Échec de l'enregistrement du service worker : " + e.message);
  });
}
</script>

</body>
</html>
