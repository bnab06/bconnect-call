<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BnB Connect — Appel</title>
<style>
  html, body { margin:0; padding:0; background:#1E1E2E; font-family:-apple-system,sans-serif; height:100%; }
  #bnb-call-root { position:relative; width:100vw; height:100vh; background:#1E1E2E; overflow:hidden; }
  #bnb-remote-video { width:100%; height:100%; object-fit:cover; background:#111; }
  #bnb-local-wrapper { position:absolute; top:24px; right:24px; width:100px; height:130px; border-radius:14px; overflow:hidden; border:2px solid white; cursor:grab; touch-action:none; background:#333; }
  #bnb-local-video { width:100%; height:100%; object-fit:cover; }
  #bnb-status { position:absolute; top:24px; left:24px; color:white; background:rgba(0,0,0,0.55); padding:8px 16px; border-radius:20px; font-size:13px; max-width:55%; }
  @supports (-webkit-touch-callout: none) {
    #bnb-status, #bnb-local-wrapper { top:max(66px, calc(env(safe-area-inset-top, 0px) + 24px)); }
  }
  #bnb-cam-help { position:absolute; left:16px; right:16px; bottom:84px; display:none; background:rgba(231,76,60,0.92); color:white; padding:12px 14px; border-radius:14px; font-size:13px; line-height:1.4; text-align:center; z-index:5; }
  #bnb-cam-help button { margin-top:8px; background:white; color:#E74C3C; border:none; border-radius:10px; padding:8px 16px; font-weight:700; font-size:13px; }
  #bnb-controls { position:absolute; bottom:16px; left:0; right:0; display:flex; justify-content:center; gap:16px; }
  .bnb-btn { width:50px; height:50px; border-radius:50%; border:none; background:#6C5CE7; color:white; font-size:20px; }
  .bnb-btn.hangup { background:#E74C3C; }
</style>
</head>
<body>

<div id="bnb-call-root">
  <video id="bnb-remote-video" autoplay playsinline></video>
  <audio id="bnb-remote-audio" autoplay></audio>

  <div id="bnb-local-wrapper">
    <video id="bnb-local-video" autoplay playsinline muted></video>
  </div>

  <div id="bnb-status">Connexion...</div>

  <div id="bnb-cam-help">
    <div id="bnb-cam-help-text"></div>
    <button id="bnb-cam-retry">📷 Réessayer la caméra</button>
  </div>

  <div id="bnb-controls">
    <button class="bnb-btn" id="bnb-toggle-mic">🎤</button>
    <button class="bnb-btn" id="bnb-toggle-cam">📷</button>
    <button class="bnb-btn hangup" id="bnb-hangup">📵</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.0/dist/livekit-client.umd.min.js"></script>
<script>
(async function () {
    function log(msg) { console.log(msg); }
    window.onerror = function (message, source, lineno) {
        log("❌ ERREUR JS: " + message + " (ligne " + lineno + ")");
    };

    const params = new URLSearchParams(window.location.search);
    const livekitUrl = params.get('url');
    const token = params.get('token');
    const showVideo = params.get('type') === 'video';
    const callId = params.get('call_id');
    const sbUrl = params.get('sb_url');
    const sbKey = params.get('sb_key');
    const sbToken = params.get('sb_token');
    const peerName = params.get('peer_name') || "L'autre personne";

    // iPhone : catégorie audio autorisant lecture ET capture.
    try { if (navigator.audioSession) { navigator.audioSession.type = "play-and-record"; } } catch (e) {}

    // Prévient la coquille (bconnect-call) que l'appel est terminé.
    // ⚠️ À n'envoyer qu'APRÈS l'enregistrement de la fin d'appel (voir notifyCallEnded),
    // car la coquille ferme ce cadre dès réception.
    function notifyParentCallEnded() {
        try { window.parent.postMessage({ type: "bnb_call_ended" }, "*"); } catch (e) {}
    }

    let callAlreadyEnded = false;
    let endPromise = null;

    function notifyCallEnded() {
        if (endPromise) { return endPromise; }

        if (callAlreadyEnded || !callId || !sbUrl || !sbKey || !sbToken) {
            log("⚠️ Notification impossible : paramètre manquant (callId=" + callId + ", sbUrl=" + (sbUrl ? "ok" : "manquant") + ", sbKey=" + (sbKey ? "ok" : "manquant") + ", sbToken=" + (sbToken ? "ok" : "manquant") + ")");
            notifyParentCallEnded();
            endPromise = Promise.resolve();
            return endPromise;
        }

        callAlreadyEnded = true;
        endPromise = (async function () {
            try {
                const controller = new AbortController();
                const timer = setTimeout(function () { controller.abort(); }, 4000);
                const resp = await fetch(`${sbUrl}/rest/v1/calls?id=eq.${callId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': sbKey,
                        'Authorization': `Bearer ${sbToken}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation',
                    },
                    body: JSON.stringify({ status: 'ended', ended_at: new Date().toISOString() }),
                    signal: controller.signal,
                });
                clearTimeout(timer);
                if (resp.ok) {
                    let rows = [];
                    try { rows = await resp.json(); } catch (e) {}
                    if (Array.isArray(rows) && rows.length > 0) {
                        console.log("📤 Statut 'terminé' confirmé par le serveur (code " + resp.status + ").");
                    } else {
                        log("❌ Aucune ligne modifiée : règle de sécurité (RLS) de la table calls, ou appel introuvable.");
                        statusEl.innerText += " (⚠️ fin d'appel non enregistrée : droits)";
                    }
                } else {
                    const errText = await resp.text();
                    log("❌ Le serveur a REJETÉ la mise à jour (code " + resp.status + "): " + errText);
                    statusEl.innerText += " (⚠️ fin d'appel non enregistrée : code " + resp.status + ")";
                }
            } catch (e) {
                log("⚠️ Impossible de notifier l'app principale : " + e.message);
            }
            notifyParentCallEnded();
        })();
        return endPromise;
    }

    let callAlreadyMarkedOngoing = false;
    async function notifyCallOngoing() {
        if (callAlreadyMarkedOngoing || !callId || !sbUrl || !sbKey || !sbToken) return;
        callAlreadyMarkedOngoing = true;
        try {
            await fetch(`${sbUrl}/rest/v1/calls?id=eq.${callId}`, {
                method: 'PATCH',
                headers: {
                    'apikey': sbKey,
                    'Authorization': `Bearer ${sbToken}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal',
                },
                body: JSON.stringify({ status: 'ongoing', answered: true }),
            });
            console.log("📤 Statut 'en cours' confirmé par le serveur.");
        } catch (e) {
            log("⚠️ Impossible de notifier le démarrage : " + e.message);
        }
    }

    // Surveille le statut côté app : si l'autre refuse ou raccroche, on se déconnecte proprement.
    let statusCheckInterval = null;
    if (callId && sbUrl && sbKey && sbToken) {
        statusCheckInterval = setInterval(async () => {
            try {
                const pollHeaders = { 'apikey': sbKey, 'Authorization': `Bearer ${sbToken}` };
                let resp = await fetch(`${sbUrl}/rest/v1/calls?id=eq.${callId}&select=status,decline_reason`, { headers: pollHeaders });
                if (!resp.ok) {
                    // Colonne decline_reason pas encore créée (script SQL 21) : lecture du statut seul.
                    resp = await fetch(`${sbUrl}/rest/v1/calls?id=eq.${callId}&select=status`, { headers: pollHeaders });
                }
                const rows = await resp.json();
                const remoteStatus = rows && rows[0] ? rows[0].status : null;
                const declineReason = rows && rows[0] ? rows[0].decline_reason : null;
                if (remoteStatus === 'declined' || remoteStatus === 'ended') {
                    console.log("📥 Statut distant détecté : " + remoteStatus + ". Déconnexion...");
                    clearInterval(statusCheckInterval);
                    callAlreadyEnded = true;
                    endPromise = Promise.resolve();
                    try {
                        await room.localParticipant.setCameraEnabled(false);
                        await room.localParticipant.setMicrophoneEnabled(false);
                    } catch (e) {}
                    room.disconnect();
                    camHelp.style.display = 'none';
                    statusEl.innerText = remoteStatus === 'declined'
                        ? (declineReason ? "💬 " + peerName + " : " + declineReason : peerName + " a refusé l'appel.")
                        : "Appel avec " + peerName + " terminé. Tu peux fermer cet onglet.";
                    notifyParentCallEnded();
                }
            } catch (e) {}
        }, 3000);
    }

    log("Démarrage. showVideo=" + showVideo);
    log("URL LiveKit: " + (livekitUrl ? livekitUrl : "MANQUANTE"));
    log("Token présent: " + (token ? "oui (" + token.length + " caractères)" : "MANQUANT"));

    const LK = LivekitClient;
    log("Version livekit-client chargée: " + (LK.version || "inconnue"));
    const room = new LK.Room();

    const statusEl = document.getElementById('bnb-status');
    const remoteVideoEl = document.getElementById('bnb-remote-video');
    const remoteAudioEl = document.getElementById('bnb-remote-audio');
    const localVideoEl = document.getElementById('bnb-local-video');
    const localWrapper = document.getElementById('bnb-local-wrapper');
    const camHelp = document.getElementById('bnb-cam-help');
    const camHelpText = document.getElementById('bnb-cam-help-text');

    if (!showVideo) {
        localWrapper.style.display = 'none';
        document.getElementById('bnb-toggle-cam').style.display = 'none';
    }

    if (!livekitUrl || !token) {
        statusEl.innerText = "❌ Lien d'appel invalide (paramètres manquants).";
        log("ARRÊT : paramètres manquants.");
        return;
    }

    // ---- Caméra -------------------------------------------------------
    // Message d'erreur persistant (le texte de statut est réécrit par les
    // événements d'appel, l'erreur de caméra s'y perdait) + bouton Réessayer.
    function camErrorText(e) {
        const n = (e && e.name) || '';
        if (n === 'NotAllowedError' || n === 'SecurityError') {
            return "Accès à la caméra refusé. Autorise la caméra pour ce site (cadenas dans la barre d'adresse ; Safari : Réglages > Sites web > Caméra), puis réessaie.";
        }
        if (n === 'NotFoundError' || n === 'OverconstrainedError') {
            return "Aucune caméra trouvée sur cet appareil.";
        }
        if (n === 'NotReadableError' || n === 'AbortError') {
            return "La caméra est déjà utilisée par une autre appli ou un autre onglet. Ferme-les puis réessaie.";
        }
        return "Caméra indisponible : " + ((e && e.message) ? e.message : (n || "erreur inconnue"));
    }

    function showCamError(text) {
        camHelpText.innerText = text;
        camHelp.style.display = 'block';
    }

    function attachLocalCamera() {
        const pub = room.localParticipant.getTrackPublication(LK.Track.Source.Camera);
        if (pub && pub.track) {
            pub.track.attach(localVideoEl);
            const p = localVideoEl.play();
            if (p && p.catch) { p.catch(function () {}); }
        }
    }

    let camOn = true;
    async function startCamera() {
        camHelp.style.display = 'none';
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showCamError("Ce navigateur n'autorise pas la caméra ici (page non sécurisée ou cadre sans droit caméra).");
            return false;
        }
        try {
            // Test direct, avec l'erreur exacte du navigateur si ça échoue.
            const test = await navigator.mediaDevices.getUserMedia({ video: true });
            test.getTracks().forEach(function (t) { t.stop(); });
            await room.localParticipant.setCameraEnabled(true);
            attachLocalCamera();
            camOn = true;
            document.getElementById('bnb-toggle-cam').style.opacity = "1";
            log("✅ Caméra activée et publiée.");
            return true;
        } catch (e) {
            log("❌ ERREUR caméra: " + (e && e.name) + " " + (e && e.message));
            showCamError(camErrorText(e));
            return false;
        }
    }
    document.getElementById('bnb-cam-retry').onclick = startCamera;

    // ---- Événements de la room ------------------------------------------
    room.on(LK.RoomEvent.ConnectionStateChanged, (state) => { log("État de connexion: " + state); });
    room.on(LK.RoomEvent.ParticipantConnected, (p) => {
        log("👤 Participant connecté: " + p.identity);
        statusEl.innerText = "Connecté avec " + peerName + "...";
        notifyCallOngoing();
    });
    room.on(LK.RoomEvent.ParticipantDisconnected, (p) => {
        log("👤 Participant déconnecté: " + (p ? p.identity : "?"));
        statusEl.innerText = peerName + " a quitté l'appel.";
    });
    room.on(LK.RoomEvent.TrackPublished, (publication, participant) => {
        log("📡 Track PUBLIÉE par " + participant.identity + " (" + publication.kind + ")");
    });
    room.on(LK.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        log("✅ Track REÇUE de " + participant.identity + " (" + track.kind + ")");
        statusEl.innerText = "En cours d'appel avec " + peerName;
        notifyCallOngoing();
        if (track.kind === 'video') { track.attach(remoteVideoEl); }
        else if (track.kind === 'audio') { track.attach(remoteAudioEl); }
    });
    room.on(LK.RoomEvent.TrackSubscriptionFailed, (trackSid, participant) => {
        log("❌ ÉCHEC subscription track " + trackSid + " de " + participant.identity);
    });
    room.on(LK.RoomEvent.TrackUnpublished, (publication, participant) => {
        log("📡 Track dépubliée par " + participant.identity);
    });
    room.on(LK.RoomEvent.LocalTrackPublished, (publication) => {
        log("📤 MA track publiée: " + publication.kind);
        if (publication.source === LK.Track.Source.Camera) { attachLocalCamera(); }
    });
    room.on(LK.RoomEvent.MediaDevicesError, (e) => {
        log("⚠️ Erreur périphérique média: " + e.message);
    });
    room.on(LK.RoomEvent.Disconnected, async (reason) => {
        log("Déconnecté. Raison: " + reason);
        try {
            await room.localParticipant.setCameraEnabled(false);
            await room.localParticipant.setMicrophoneEnabled(false);
        } catch (e) {}
        camHelp.style.display = 'none';
        statusEl.innerText = "Appel avec " + peerName + " terminé. Tu peux fermer cet onglet.";
        notifyCallEnded();
    });
    room.on(LK.RoomEvent.Reconnecting, () => { log("🔄 Reconnexion en cours..."); });
    room.on(LK.RoomEvent.Reconnected, () => { log("✅ Reconnecté."); });

    try {
        log("Tentative de connexion à la room...");
        await room.connect(livekitUrl, token);
        log("✅ Connecté à la room. SID room: " + room.name);
        log("Nombre de participants déjà présents: " + room.numParticipants);
        statusEl.innerText = "Connecté. Activation du micro...";

        try {
            await room.localParticipant.setMicrophoneEnabled(true);
            log("✅ Micro activé et publié.");
            statusEl.innerText = "En attente de l'autre participant...";
        } catch (micErr) {
            log("❌ ERREUR micro: " + micErr.message);
            statusEl.innerText = "⚠️ Micro refusé : " + micErr.message;
        }

        if (showVideo) { await startCamera(); }

        if (room.remoteParticipants.size > 0) {
            statusEl.innerText = "Connecté avec " + peerName + "...";
            notifyCallOngoing();
        }
        room.remoteParticipants.forEach((participant) => {
            log("👤 Déjà présent: " + participant.identity);
            participant.trackPublications.forEach((pub) => {
                log("   -> track existante: " + pub.kind + " (souscrite: " + pub.isSubscribed + ")");
            });
        });

    } catch (err) {
        log("❌ ERREUR de connexion à la room: " + err.message);
        statusEl.innerText = "❌ Erreur de connexion : " + err.message;
        setTimeout(function () { notifyCallEnded(); }, 3500);
    }

    let micOn = true;
    document.getElementById('bnb-toggle-mic').onclick = async function () {
        micOn = !micOn;
        await room.localParticipant.setMicrophoneEnabled(micOn);
        this.style.opacity = micOn ? "1" : "0.5";
        log("Micro " + (micOn ? "réactivé" : "coupé") + " manuellement.");
    };

    document.getElementById('bnb-toggle-cam').onclick = async function () {
        // Si la caméra n'a jamais démarré, ce bouton sert à la relancer.
        const pub = room.localParticipant.getTrackPublication(LK.Track.Source.Camera);
        if (!pub || !pub.track) { await startCamera(); return; }
        camOn = !camOn;
        await room.localParticipant.setCameraEnabled(camOn);
        if (camOn) { attachLocalCamera(); }
        this.style.opacity = camOn ? "1" : "0.5";
        log("Caméra " + (camOn ? "réactivée" : "coupée") + " manuellement.");
    };

    document.getElementById('bnb-hangup').onclick = async function () {
        log("Raccroché manuellement.");
        if (statusCheckInterval) clearInterval(statusCheckInterval);
        try {
            await room.localParticipant.setCameraEnabled(false);
            await room.localParticipant.setMicrophoneEnabled(false);
        } catch (e) {
            log("⚠️ Erreur en coupant caméra/micro : " + e.message);
        }
        room.disconnect();
        camHelp.style.display = 'none';
        statusEl.innerText = "Appel avec " + peerName + " terminé. Tu peux fermer cet onglet.";
        notifyCallEnded();
    };

    // Caméra locale déplaçable (souris + tactile)
    let dragging = false;
    let offsetX = 0, offsetY = 0;

    function startDrag(x, y) {
        dragging = true;
        const rect = localWrapper.getBoundingClientRect();
        offsetX = x - rect.left;
        offsetY = y - rect.top;
        localWrapper.style.cursor = 'grabbing';
    }
    function doDrag(x, y) {
        if (!dragging) return;
        const rootRect = document.getElementById('bnb-call-root').getBoundingClientRect();
        let newLeft = x - rootRect.left - offsetX;
        let newTop = y - rootRect.top - offsetY;
        newLeft = Math.max(0, Math.min(newLeft, rootRect.width - localWrapper.offsetWidth));
        newTop = Math.max(0, Math.min(newTop, rootRect.height - localWrapper.offsetHeight));
        localWrapper.style.left = newLeft + 'px';
        localWrapper.style.top = newTop + 'px';
        localWrapper.style.right = 'auto';
    }
    function endDrag() { dragging = false; localWrapper.style.cursor = 'grab'; }

    localWrapper.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    document.addEventListener('mousemove', (e) => doDrag(e.clientX, e.clientY));
    document.addEventListener('mouseup', endDrag);
    localWrapper.addEventListener('touchstart', (e) => { const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive: true});
    document.addEventListener('touchmove', (e) => { const t = e.touches[0]; doDrag(t.clientX, t.clientY); }, {passive: true});
    document.addEventListener('touchend', endDrag);
})();
</script>

</body>
</html>
